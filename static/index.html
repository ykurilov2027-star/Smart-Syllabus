<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Syllabus — Конспект-Трекер</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f3f5f9; }
      body { max-width: 760px; margin: 3rem auto; padding: 0 1rem; }
      main { padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 4px 24px #17203312; }
      h1 { margin-top: 0; }
      label { display: block; margin: 1rem 0 .4rem; font-weight: 600; }
      textarea, input, button { box-sizing: border-box; width: 100%; padding: .75rem; font: inherit; }
      textarea { min-height: 180px; resize: vertical; }
      button { margin-top: 1rem; border: 0; border-radius: 6px; background: #3156a6; color: white; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      pre { overflow: auto; padding: 1rem; background: #f3f5f9; border-radius: 6px; white-space: pre-wrap; }
      #status { color: #52617a; }
    </style>
  </head>
  <body>
    <main>
      <h1>Smart Syllabus</h1>
      <p>Технічний прототип: надішліть текст силабуса, щоб перевірити API-контракт.</p>
      <p id="status" role="status">Перевіряємо стан сервера…</p>
      <form id="parse-form">
        <label for="source-text">Текст силабуса</label>
        <textarea id="source-text" required maxlength="100000" placeholder="Вставте текст силабуса"></textarea>
        <label for="case-id">Приклад mock (необов'язково)</label>
        <input id="case-id" autocomplete="off" placeholder="intro-course або project-course">
        <button id="submit-button" type="submit">Надіслати тестовий запит</button>
      </form>
      <h2>Відповідь сервера</h2>
      <pre id="result" aria-live="polite">Результат з'явиться тут.</pre>
    </main>
    <script>
      const status = document.querySelector("#status");
      const result = document.querySelector("#result");
      const form = document.querySelector("#parse-form");
      const button = document.querySelector("#submit-button");

      function show(value) {
        result.textContent = JSON.stringify(value, null, 2);
      }

      async function loadHealth() {
        try {
          const response = await fetch("/api/health");
          const body = await response.json();
          status.textContent = response.ok
            ? `Сервер: ${body.status} · ${body.provider} · ${body.mode}`
            : `Сервер повернув помилку (${response.status}).`;
        } catch {
          status.textContent = "Сервер недоступний.";
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        try {
          const caseId = document.querySelector("#case-id").value.trim();
          const response = await fetch("/api/v1/syllabi/parse", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              source_text: document.querySelector("#source-text").value,
              case_id: caseId || null
            })
          });
          show(await response.json());
        } catch {
          show({
            error: {
              kind: "unavailable",
              message: "The server could not be reached.",
              retryable: true,
              request_id: "unavailable"
            }
          });
        } finally {
          button.disabled = false;
        }
      });

      loadHealth();
    </script>
  </body>
</html>
